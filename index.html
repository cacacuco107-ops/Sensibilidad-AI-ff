        :root {

          --card: #121212;
          --card-2: #171717;
          --red: #FF0040;
          --red-glow: 0 0 12px rgba(255,0,64,0.6), 0 0 28px rgba(255,0,64,0.25);
          --red-border: rgba(255,0,64,0.55);
          --yellow: #FFD60A;
        }
        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .orbitron { font-family: 'Orbitron', monospace; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .neon-border {
          border: 1px solid var(--red-border);
          box-shadow: var(--red-glow), inset 0 0 0 1px rgba(255,0,64,0.08);
        }
        .neon-button {
          background: linear-gradient(180deg, #FF0040 0%, #CC0033 100%);
          box-shadow: 0 0 18px rgba(255,0,64,0.5), 0 4px 12px rgba(0,0,0,0.6);
        }
        .neon-button:active { transform: scale(0.98); }
        .glass { backdrop-filter: blur(12px); background: rgba(18,18,18,0.86); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #FF0040; border-radius: 999px; }
        @keyframes spin-red {
          to { transform: rotate(360deg); }
        }
        @keyframes slide-up {
          from { opacity:0; transform: translateY(18px); }
          to { opacity:1; transform: translateY(0); }
        }
        @keyframes pulse-glow {
          0%,100% { box-shadow: 0 0 12px rgba(255,0,64,0.6), 0 0 28px rgba(255,0,64,0.25); }

          0% { transform: scale(0.5) translateY(20px); opacity: 0; }
          50% { transform: scale(1.1) translateY(-5px); opacity: 1; }
          100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes calibradaExit {
          0% { transform: scale(1) translateY(0); opacity: 1; }
          100% { transform: scale(0.9) translateY(-80px); opacity: 0; }
        }
        @keyframes slideUpResults {
          from { transform: translateY(100px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }

          100% { transform: translateX(150%) skewX(-12deg); }
        }

          border: 1.5px solid rgba(255,0,64,0.9);

          left: 0;

          animation: slideUpResults 0.7s cubic-bezier(0.16,1,0.3,1) both;
        }

          border-radius: 50%;
          border: 4px solid rgba(255,0,64,0.18);

          border-right-color: transparent;
          border-bottom-color: rgba(255,0,64,0.55);
          animation: spin-red 1s linear infinite;
          box-shadow: 0 0 18px rgba(255,0,64,0.45);
        }
        .red-loader-inner {
          position:absolute;
          inset:8px;
          border-radius:50%;
          border: 2px dashed rgba(255,0,64,0.25);
